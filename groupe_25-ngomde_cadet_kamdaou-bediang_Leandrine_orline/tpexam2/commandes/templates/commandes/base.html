<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestion des commandes{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Gestion des commandes</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'dashboard' %}">Tableau de bord</a>
      <a class="nav-link" href="{% url 'commandes' %}">Commandes</a>
      <a class="nav-link" href="{% url 'produits' %}">Produits</a>
      <a class="nav-link" href="{% url 'clients' %}">Clients</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">{{ m }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
