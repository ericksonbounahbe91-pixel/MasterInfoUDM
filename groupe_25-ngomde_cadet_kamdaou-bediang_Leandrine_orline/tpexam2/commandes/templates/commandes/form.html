{% extends "commandes/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
<div class="card shadow-sm"><div class="card-body">
  <h3 class="card-title mb-4">{{ titre }}</h3>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    {% for f in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
        {{ f }}
        {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-link" href="{{ retour|default:'/commandes/' }}">Annuler</a>
  </form>
</div></div></div></div>
<script>
  document.querySelectorAll("input:not([type=file]):not([type=checkbox]), select")
    .forEach(e => e.classList.add(e.tagName === "SELECT" ? "form-select" : "form-control"));
  document.querySelectorAll("input[type=file]").forEach(e => e.classList.add("form-control"));
</script>
{% endblock %}
